<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" role="img" aria-label="Desk B asks for the chat. Desk A stops its turn and sends the chat through the relay. The chat opens on Desk B. Desk A shows where the chat went.">
  <defs>
    <marker id="wn-nh-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="wn-nh-head-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="box" x="20" y="20" width="180" height="140" rx="8"/>
  <text class="t-title" x="34" y="42">Desk A</text>
  <text class="t-muted t-small" x="34" y="58">had the chat</text>
  <rect class="box-dim" x="34" y="70" width="152" height="30" rx="5"/>
  <text class="t-muted t-small" x="44" y="89">Chat: login bug</text>
  <rect class="pill-warn" x="34" y="112" width="152" height="36" rx="6"/>
  <text class="t-warn t-small" x="44" y="127">Continued on Desk B</text>
  <text class="t-warn t-small" x="44" y="141">View | Take back here</text>
  <rect class="box" x="250" y="58" width="140" height="64" rx="6"/>
  <text class="t-title" x="320" y="81" text-anchor="middle">Relay</text>
  <text class="t-muted t-small" x="320" y="97" text-anchor="middle">passes encrypted data</text>
  <text class="t-muted t-small" x="320" y="111" text-anchor="middle">stores nothing</text>
  <rect class="box" x="440" y="20" width="180" height="140" rx="8"/>
  <text class="t-title" x="454" y="42">Desk B</text>
  <text class="t-muted t-small" x="454" y="58">where you are now</text>
  <rect class="fill-chat" x="454" y="70" width="152" height="30" rx="6"/>
  <text class="t-on" x="530" y="90" text-anchor="middle">Continue here</text>
  <rect class="box-hi" x="454" y="112" width="152" height="36" rx="5"/>
  <text class="t-small" x="464" y="134">Chat: login bug</text>
  <path class="line" d="M438 74 H394" marker-end="url(#wn-nh-head)"/>
  <path class="line" d="M248 74 H204" marker-end="url(#wn-nh-head)"/>
  <path class="line-hi" d="M202 106 H246" marker-end="url(#wn-nh-head-hi)"/>
  <path class="line-hi" d="M392 106 H436" marker-end="url(#wn-nh-head-hi)"/>
  <circle class="fill-chat" cx="416" cy="74" r="9"/>
  <text class="t-on t-small" x="416" y="78" text-anchor="middle">1</text>
  <circle class="fill-chat" cx="224" cy="106" r="9"/>
  <text class="t-on t-small" x="224" y="110" text-anchor="middle">2</text>
  <circle class="fill-chat" cx="29" cy="186" r="9"/>
  <text class="t-on t-small" x="29" y="190" text-anchor="middle">1</text>
  <text x="46" y="190">On Desk B, click Continue here.</text>
  <circle class="fill-chat" cx="29" cy="208" r="9"/>
  <text class="t-on t-small" x="29" y="212" text-anchor="middle">2</text>
  <text x="46" y="212">Desk A stops its turn, then sends the chat through the relay.</text>
  <circle class="fill-chat" cx="29" cy="230" r="9"/>
  <text class="t-on t-small" x="29" y="234" text-anchor="middle">3</text>
  <text x="46" y="234">The chat opens on Desk B with all its history.</text>
  <circle class="fill-chat" cx="29" cy="252" r="9"/>
  <text class="t-on t-small" x="29" y="256" text-anchor="middle">4</text>
  <text x="46" y="256">Desk A shows where the chat went. Take back here moves it back.</text>
</svg>
