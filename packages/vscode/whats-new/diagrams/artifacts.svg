<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Your agent publishes an artifact. Every version is kept on this computer. Open shows the page in the VS Code browser. With Nests on, your other desks see it too.">
  <defs>
    <marker id="wn-af-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="wn-af-head-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="box" x="20" y="50" width="150" height="70" rx="8"/>
  <text class="t-title" x="34" y="74">Your agent</text>
  <text class="t-muted t-small" x="34" y="92">publishes a page,</text>
  <text class="t-muted t-small" x="34" y="106">a plan or a report</text>
  <path class="line-hi" d="M172 85 H206" marker-end="url(#wn-af-head-hi)"/>
  <rect class="box" x="210" y="30" width="200" height="110" rx="8"/>
  <text class="t-title" x="224" y="52">Artifacts</text>
  <text class="t-muted t-small" x="224" y="68">on this computer</text>
  <rect class="box-dim" x="224" y="80" width="46" height="26" rx="4"/>
  <text class="t-muted" x="247" y="97" text-anchor="middle">v1</text>
  <rect class="box-dim" x="278" y="80" width="46" height="26" rx="4"/>
  <text class="t-muted" x="301" y="97" text-anchor="middle">v2</text>
  <rect class="box-hi" x="332" y="80" width="46" height="26" rx="4"/>
  <text class="t-title" x="355" y="97" text-anchor="middle">v3</text>
  <text class="t-small" x="224" y="126">Every version is kept</text>
  <text class="t-small" x="416" y="76">Open</text>
  <path class="line-hi" d="M412 85 H446" marker-end="url(#wn-af-head-hi)"/>
  <rect class="box" x="450" y="30" width="170" height="110" rx="8"/>
  <text class="t-title" x="464" y="52">VS Code browser</text>
  <rect class="box-hi" x="464" y="62" width="142" height="46" rx="3"/>
  <rect class="fill-chat" x="472" y="70" width="70" height="7" rx="2"/>
  <rect class="fill-muted" x="472" y="83" width="120" height="5" rx="2"/>
  <rect class="fill-muted" x="472" y="94" width="96" height="5" rx="2"/>
  <text class="t-muted t-small" x="464" y="128">local only, in a sandbox</text>
  <path class="line dash" d="M310 142 V168" marker-end="url(#wn-af-head)"/>
  <rect class="box-dim" x="210" y="172" width="200" height="36" rx="6"/>
  <text class="t-small" x="224" y="194">Your other desks (Nests on)</text>
</svg>
